name: Verify blog
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: caiya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/caiya_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: ci-only-database-password
      DB_URL: jdbc:postgresql://127.0.0.1:5432/caiya
      DB_USER: postgres
      DB_PASSWORD: ci-only-database-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-browser-password
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-only-browser-password
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-database-password
      MEDIA_DIR: ${{ github.workspace }}/.local/uploads
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.1", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Backend tests and production jar
        run: |
          mkdir -p .local/uploads
          createdb caiya
          mvn -f server/pom.xml -B -ntp verify dependency:list -DincludeScope=runtime -DoutputFile="$PWD/.local/java-dependencies.txt"
          python3 scripts/test-production-roles.py server/target/caiya-server-0.1.0.jar
      - name: Frontend gates
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chrome
      - name: Real browser workflows
        run: |
          LOGIN_CAPTCHA_ALWAYS_REQUIRED=false java -jar server/target/caiya-server-*.jar > .local/server.log 2>&1 &
          echo $! > .local/server.pid
          node web/.output/server/index.mjs > .local/web.log 2>&1 &
          echo $! > .local/web.pid
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/api/public/site > /dev/null; then break; fi; sleep 1; done
          pnpm --dir web test:e2e
      - name: Backup and isolated restore
        run: |
          node scripts/recovery-fixture.mjs prepare
          kill "$(cat .local/server.pid)" "$(cat .local/web.pid)"
          for i in {1..20}; do if ! curl -s http://127.0.0.1:8080/api/public/site > /dev/null; then break; fi; sleep 1; done
          python3 scripts/backup.py backup --media .local/uploads --out .local/ci-backup
          python3 scripts/backup.py restore --bundle .local/ci-backup --target caiya_restore_ci --media .local/restored-media
          python3 scripts/test-backup-safety.py .local/ci-backup .local/restored-media
          DB_URL=jdbc:postgresql://127.0.0.1:5432/caiya_restore_ci MEDIA_DIR="$PWD/.local/restored-media" java -jar server/target/caiya-server-*.jar --server.port=8081 > .local/restore.log 2>&1 &
          restore_pid=$!
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8081/api/public/site > /dev/null; then break; fi; sleep 1; done
          RECOVERY_API=http://127.0.0.1:8081 node scripts/recovery-fixture.mjs verify
          kill "$restore_pid"
      - name: Dependency audit
        run: |
          pnpm --dir web audit --json > .local/npm-audit.json || true
          python3 scripts/check-web-audit.py .local/npm-audit.json
          python3 scripts/audit-java.py .local/java-dependencies.txt --out .local/java-audit.json
      - name: Secret scan
        run: |
          curl -fsSLo .local/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo .local/checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd .local
          mv gitleaks.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd ..
          .local/gitleaks git . --redact --no-banner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            server/target/surefire-reports/
            .local/server.log
            .local/web.log
          retention-days: 3
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-container-database-only
      MIGRATION_PASSWORD: ci-container-migration-only
      DB_PASSWORD: ci-container-runtime-only
      ADMIN_PASSWORD: ci-container-admin-only
      SITE_URL: http://127.0.0.1:8088
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start deployment stack
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml build
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8088/api/public/site
          curl --fail http://127.0.0.1:8088/
          docker compose -f deploy/compose.yaml exec -T nginx nginx -t
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
