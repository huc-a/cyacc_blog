# Included inside each proxy location on the existing HTTPS virtual host.
# Assumes DNS points directly to ECS, with no CDN/load balancer in front.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
# Remove client-supplied alternatives interpreted by ForwardedHeaderFilter.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_read_timeout 30s;
proxy_http_version 1.1;
# Do not inherit caching rules from the previous static site.
proxy_cache off;
expires off;
