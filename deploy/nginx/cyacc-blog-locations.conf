# Include inside the EXISTING cyacc.cn HTTPS server block after removing
# conflicting static-site locations. Keep certificate and ACME configuration.
client_max_body_size 6m;

location = /api/auth/login {
    limit_req zone=cyacc_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8089;
    include /etc/nginx/snippets/cyacc-proxy-headers.conf;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8089;
    include /etc/nginx/snippets/cyacc-proxy-headers.conf;
    proxy_no_cache 1;
}
location / {
    proxy_pass http://127.0.0.1:8088;
    include /etc/nginx/snippets/cyacc-proxy-headers.conf;
}
