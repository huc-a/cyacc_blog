name: caiya-blog
services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    environment:
      POSTGRES_DB: caiya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-blog.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d caiya"]
      interval: 5s
      retries: 20
    networks: [private]
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.server }
    image: caiya-server:${RELEASE_TAG:-local}
    command: [--migrate-only]
    environment:
      DB_URL: jdbc:postgresql://db:5432/caiya
      MIGRATION_USER: blog_migrator
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  media-init:
    image: caiya-server:${RELEASE_TAG:-local}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    # Existing/restored volumes do not inherit the image directory's owner.
    # Change only the volume root; never recursively alter uploaded files.
    command: ["test -d /app/uploads && test ! -L /app/uploads && chmod u+rwx /app/uploads && chown 10001:10001 /app/uploads"]
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
        volume: { nocopy: true }
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
  server:
    image: caiya-server:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/caiya
      DB_USER: blog_runtime
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      MEDIA_DIR: /app/uploads
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_TOKEN: ${UMAMI_TOKEN:-}
    volumes: ["uploads:/app/uploads"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, 'test -w "$$MEDIA_DIR" && test -x "$$MEDIA_DIR" && curl -fsS http://localhost:8080/api/public/site']
      interval: 10s
      start_period: 30s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      media-init: { condition: service_completed_successfully }
    networks: [private, outbound]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: caiya-web:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      NUXT_API_BASE: http://server:8080
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:?Set HTTPS SITE_URL}
      NUXT_PUBLIC_UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
    depends_on:
      server: { condition: service_healthy }
    networks: [private]
  nginx:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      web: { condition: service_healthy }
    networks: [private]
  ops:
    profiles: [ops]
    build: { context: .., dockerfile: deploy/Dockerfile.ops }
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: volume
        source: uploads
        target: /media
        read_only: true
        volume: { nocopy: true }
      - ${BACKUP_DIR:-../.local/backups}:/backups
    networks: [private]
volumes:
  database:
  uploads:
networks:
  private: { internal: true }
  outbound:
