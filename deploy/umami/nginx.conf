# Install as /etc/nginx/conf.d/cyacc-umami.conf after certificate issuance.
limit_req_zone $binary_remote_addr zone=cyacc_umami_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cyacc_umami_collect:2m rate=20r/s;

server {
    listen 80;
    server_name stats.cyacc.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cyacc-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://stats.cyacc.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name stats.cyacc.cn;
    ssl_certificate /etc/letsencrypt/live/stats.cyacc.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.cyacc.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    access_log /var/log/nginx/cyacc-umami-access.log;
    error_log /var/log/nginx/cyacc-umami-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=cyacc_umami_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }
    location = /api/send {
        limit_req zone=cyacc_umami_collect burst=40 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }
    location / { proxy_pass http://127.0.0.1:3010; }
}
