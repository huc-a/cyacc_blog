server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/caiya}
    username: ${DB_USER:caiya}
    password: ${DB_PASSWORD:}
  flyway:
    user: ${MIGRATION_USER:${DB_USER:caiya}}
    password: ${MIGRATION_PASSWORD:${DB_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  mapper-locations: classpath:mappers/*.xml
app:
  login:
    captcha-always-required: ${LOGIN_CAPTCHA_ALWAYS_REQUIRED:true}
    # Only enable when a reverse proxy that OVERWRITES X-Forwarded-For with
    # the real client address is the sole entry point; otherwise the header
    # is spoofable and login rate limiting must key on the peer address.
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:180}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  media-dir: ${MEDIA_DIR:./uploads}
  umami-url: ${UMAMI_URL:}
  umami-api-url: ${UMAMI_API_URL:}
  umami-website-id: ${UMAMI_WEBSITE_ID:}
  umami-token: ${UMAMI_TOKEN:}
