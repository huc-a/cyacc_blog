function render(){renderNav();const names={dashboard:'工作台',analytics:'数据统计',list:TYPES[listType].name,editor:'编辑'+TYPES[editing?.type||'article'].name,media:'媒体库',appearance:'外观设置',settings:'系统设置'};$('crumb').textContent=names[view];$('statsBadge').hidden=view!=='analytics';$('viewHost').hidden=view==='analytics';$('analyticsHost').hidden=view!=='analytics';if(view==='analytics'){if(!statsLoaded){$('analyticsFrame').srcdoc=ANALYTICS_HTML;statsLoaded=true}return}const fn={dashboard:dashboardHtml,list:listHtml,editor:editorHtml,media:mediaHtml,appearance:appearanceHtml,settings:settingsHtml};$('viewHost').innerHTML=fn[view]();if(view==='editor')bindEditor();if(view==='appearance')updatePreview()}
function head(title,sub,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">CAIYA / CONTENT STUDIO</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="buttons">${buttons}</div></div>`}function badge(s){const [name,color]=({published:['已发布','green'],draft:['草稿','amber'],pending:['待核验','amber'],valid:['有效 · 手动','green'],expired:['已过期','gray'],invalid:['已失效','rose']})[s]||[s,'gray'];return `<span class="badge ${color}">${E(name)}</span>`}function validity(x){return x.deadline&&x.deadline<now().slice(0,10)?'expired':x.validity||'pending'}
function miniChart(){const a=SYNTHETIC_SUMMARY.daily,max=Math.max(...a)*1.2,min=Math.min(...a)*.8;const points=a.map((v,i)=>`${20+i*90},${120-(v-min)/(max-min)*90}`).join(' ');return `<svg viewBox="0 0 580 145" role="img" aria-label="近七天合成浏览量趋势"><path d="M20 120H560M20 70H560M20 20H560" stroke="#e6edda" stroke-dasharray="3 5"/><polygon points="20,125 ${points} 560,125" fill="#d8e7c355"/><polyline points="${points}" fill="none" stroke="#9cb97b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${a.map((v,i)=>`<circle cx="${20+i*90}" cy="${120-(v-min)/(max-min)*90}" r="3" fill="#fbfcf6" stroke="#9cb97b"><title>10/${15+i} · PV ${v}</title></circle>`).join('')}<text x="20" y="142" font-size="8" fill="#a8b996">10/15</text><text x="540" y="142" font-size="8" fill="#a8b996">10/21</text></svg>`}
function dashboardHtml(){const drafts=live().filter(x=>x.status==='draft'),pending=live('deal').filter(x=>validity(x)==='pending'),sites=live('website').filter(x=>!x.url),s=SYNTHETIC_SUMMARY;return `<section class="welcome"><div><div class="eyebrow">A LITTLE SPACE FOR YOUR IDEAS</div><h1>你好，菜牙。今天也认真记录。</h1><p>整理想法，收藏发现，让这个小小的内容空间慢慢生长。</p><div class="buttons"><button class="primary" onclick="startEdit(null,'article')">＋ 写文章</button><button onclick="startEdit(null,'work')">添加作品</button><button onclick="navigate('analytics')">查看数据 ↗</button></div></div><div class="art" aria-hidden="true"><div class="orbit"></div><div class="leaf second"></div><div class="leaf"></div><small>WRITE A LITTLE.<br>GROW A LITTLE.</small></div></section><div class="metricgrid">${[['草稿箱',drafts.length,'继续那些未完成的想法'],['已发布内容',live().filter(x=>x.status==='published').length,'本地演示发布状态'],['待核验羊毛',pending.length,'需要补充来源与条件'],['网站待配置',sites.length,'尚未填写访问地址']].map(([n,v,note])=>`<div class="metric"><div class="label">${n}</div><div class="value">${String(v).padStart(2,'0')}</div><div class="note">${note}</div></div>`).join('')}</div><div class="dashgrid"><section class="panel"><div class="ph"><h2>继续编辑</h2><button class="quiet" style="font-size:10px" onclick="navigate('list','article')">全部内容 ↗</button></div>${drafts.slice(0,4).map(x=>`<div class="draftrow"><div class="doc">${TYPES[x.type].icon}</div><div class="info"><b>${E(x.title)}</b><small>${TYPES[x.type].name} · ${date(x.updated)}</small></div><button onclick="startEdit('${x.id}')">继续编辑</button></div>`).join('')||'<div class="empty">还没有草稿，开始新的记录吧。</div>'}</section><section class="panel"><div class="ph"><h2>待处理事项</h2><small>FROM HERE</small></div><div class="todo"><div class="symbol">✧</div><div><strong>${pending.length} 条羊毛待核验</strong><small>检查领取条件、来源与截止日期</small></div><button onclick="navigate('list','deal')">查看 ›</button></div><div class="todo"><div class="symbol">↗</div><div><strong>${sites.length} 个网站待配置</strong><small>补充真实地址后再对外展示</small></div><button onclick="navigate('list','website')">查看 ›</button></div><div class="todo"><div class="symbol">⇩</div><div><strong>数据保存在当前浏览器</strong><small>${storageOK?'建议定期导出本地 JSON':'存储不可用，请导出备份'}</small></div><button onclick="exportBackup()">备份 ›</button></div></section></div><div class="dashgrid"><section class="panel"><div class="ph"><h2>近 7 天访问概览</h2><button class="quiet" style="font-size:10px" onclick="navigate('analytics')">完整统计 ↗</button></div><div class="smallstats"><div>浏览量 PV<b>${s.pv.toLocaleString()}</b></div><div>访客数 UV<b>${s.uv.toLocaleString()}</b></div><div>会话数<b>${s.sessions.toLocaleString()}</b></div></div><div class="mini-chart">${miniChart()}</div><p class="footnote">合成演示数据 · 2026-10-15 至 2026-10-21 · 与统计页使用同一份样本。</p></section><section class="panel"><div class="ph"><h2>最近操作</h2><small>LOCAL ACTIVITY</small></div>${state.log.slice(0,4).map(x=>`<div class="activity"><time>${date(x.date).slice(5)}</time><span>${E(x.text)}</span></div>`).join('')}<p class="footnote">上次导出：${state.backupAt?date(state.backupAt):'尚未导出'}<br>操作日志与内容为本地数据，访问统计为固定合成样本。</p></section></div>`}
function rows(){return state.items.filter(x=>x.type===listType&&(status==='trash'?x.deleted:!x.deleted)&&(status==='all'||status==='trash'||x.status===status)&&(!category||x.category===category)&&(!query||[x.title,x.summary,x.tags].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.updated.localeCompare(a.updated))}
function listHtml(){const t=TYPES[listType],all=rows(),pages=Math.max(1,Math.ceil(all.length/6));page=Math.min(page,pages);const count={all:live(listType).length,draft:live(listType).filter(x=>x.status==='draft').length,published:live(listType).filter(x=>x.status==='published').length,trash:state.items.filter(x=>x.type===listType&&x.deleted).length};const cats=[...new Set(state.items.filter(x=>x.type===listType).map(x=>x.category).filter(Boolean))];return head(t.name+'管理','管理你的'+t.name+'，把零散内容整理成清楚的记录。',`<button class="primary" onclick="startEdit(null,'${listType}')">＋ ${t.action}</button>`)+`<section class="panel tablepanel"><div class="tabs">${[['all','全部'],['draft','草稿'],['published','已发布'],['trash','回收站']].map(([id,n])=>`<button class="tab ${id===status?'active':''}" onclick="setStatus('${id}')">${n}<span>${count[id]}</span></button>`).join('')}</div><div class="filters"><input class="input" id="listQuery" value="${E(query)}" placeholder="⌕ 搜索标题、摘要或标签…" aria-label="搜索内容" oninput="searchList(this.value)"><select aria-label="按分类筛选" onchange="setCategory(this.value)"><option value="">全部分类</option>${cats.map(c=>`<option ${c===category?'selected':''}>${E(c)}</option>`).join('')}</select><small>共 ${all.length} 条内容</small></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="选择当前页" onchange="selectPage(this.checked)"></th><th>${listType==='work'?'作品名称':listType==='website'?'网站名称':'标题'}</th><th>分类</th><th>${listType==='deal'?'发布 / 有效状态':'状态'}</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${all.slice((page-1)*6,page*6).map(x=>`<tr><td><input type="checkbox" ${selection.has(x.id)?'checked':''} aria-label="选择${E(x.title)}" onchange="selectItem('${x.id}',this.checked)"></td><td class="titlecell"><button onclick="startEdit('${x.id}')">${E(x.title)}</button><small>${x.type==='work'?E(x.tech||'尚未填写技术栈'):x.type==='website'?E(x.url||'未配置网址 · 示例'):E(x.tags||'暂无标签')}</small></td><td>${E(x.category||'未分类')}</td><td>${badge(x.status)}${x.type==='deal'?'<div style="margin-top:5px">'+badge(validity(x))+'</div>':''}</td><td style="white-space:nowrap">${date(x.updated)}</td><td><div class="rowactions">${x.deleted?`<button onclick="restoreItem('${x.id}')">恢复</button><button onclick="deleteItem('${x.id}',true)">永久删除</button>`:`<button onclick="startEdit('${x.id}')">编辑</button><button onclick="rowMenu('${x.id}')" aria-label="更多操作">···</button>`}</div></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">没有匹配的内容，试试调整筛选条件。</div></td></tr>'}</tbody></table></div><div id="bulkHost">${bulkHtml()}</div><div class="tablefoot"><span>显示 ${all.length?(page-1)*6+1:0}–${Math.min(page*6,all.length)} 条，共 ${all.length} 条</span><div class="pagination"><button ${page===1?'disabled':''} onclick="goPage(${page-1})">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('')}<button ${page===pages?'disabled':''} onclick="goPage(${page+1})">›</button></div></div></section><p class="footnote">${listType==='deal'?'发布状态与有效状态分开管理；条目为演示，不代表真实优惠。填写截止日期后参与过期判断。':'保存与发布仅影响当前浏览器中的演示内容，不改变真实网站或访问统计样本。'}</p>`}
function setStatus(v){status=v;page=1;selection.clear();render()}function setCategory(v){category=v;page=1;selection.clear();render()}let searchTimer;function searchList(v){query=v;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const pos=$('listQuery')?.selectionStart;page=1;selection.clear();render();if($('listQuery')){$('listQuery').focus();$('listQuery').setSelectionRange(pos,pos)}},200)}function goPage(n){page=n;selection.clear();render()}function selectItem(id,c){c?selection.add(id):selection.delete(id);$('bulkHost').innerHTML=bulkHtml()}function selectPage(c){rows().slice((page-1)*6,page*6).forEach(x=>c?selection.add(x.id):selection.delete(x.id));render()}function bulkHtml(){return selection.size?`<div class="bulk"><span>已选择 ${selection.size} 项</span>${status==='trash'?'<button onclick="bulkAction(\'restore\')">恢复</button>':'<button onclick="bulkAction(\'draft\')">设为草稿</button><button class="danger" onclick="bulkAction(\'trash\')">移入回收站</button>'}</div>`:''}function bulkAction(action){confirmLocal('批量操作','将更新选中的 '+selection.size+' 条本地演示内容，是否继续？',()=>{state.items.forEach(x=>{if(selection.has(x.id)){if(action==='trash')x.deleted=true;if(action==='restore')x.deleted=false;if(action==='draft')x.status='draft';x.updated=now()}});log('批量更新 '+selection.size+' 条内容');persist();selection.clear();render();toast('批量操作已完成')})}function rowMenu(id){const x=state.items.find(x=>x.id===id);modal('内容操作','<p>'+E(x.title)+'</p>',`<button onclick="closeModal();startEdit('${id}')">编辑</button><button class="danger" onclick="closeModal();deleteItem('${id}')">移入回收站</button>`)}function deleteItem(id,permanent=false){confirmLocal(permanent?'永久删除？':'移入回收站？',permanent?'此条本地记录删除后无法恢复。':'内容将移入回收站，可在回收站恢复。',()=>{const x=state.items.find(x=>x.id===id);if(permanent)state.items=state.items.filter(x=>x.id!==id);else{x.deleted=true;x.updated=now()}log((permanent?'永久删除：':'移入回收站：')+x.title);persist();selection.delete(id);render();toast('本地内容已更新')})}function restoreItem(id){const x=state.items.find(x=>x.id===id);x.deleted=false;x.updated=now();log('恢复：'+x.title);persist();render();toast('内容已恢复')}
function startEdit(id,type='article',force=false){if((dirty||appearanceDirty)&&!force){confirmLocal('切换编辑内容？','未保存修改会被丢弃。',()=>{dirty=false;appearanceDirty=false;startEdit(id,type,true)});return}const old=state.items.find(x=>x.id===id);if(old?.deleted){toast('请先恢复这条内容');return}if(view==='appearance')applyAppearance(state.appearance);editing=old?JSON.parse(JSON.stringify(old)):{id:'new-'+Date.now(),type,title:'',summary:'',body:type==='article'?bodyText:'',category:'',tags:'',status:'draft',deleted:false,featured:false,url:'',repo:'',tech:'',chapters:'',validity:type==='deal'?'pending':'',deadline:'',requirements:''};dirty=false;editPreview=false;view='editor';listType=editing.type;closeMenu();render();window.scrollTo({top:0,behavior:'instant'})}
function extraFields(x){const input=(label,key,kind='text',hint='')=>`<div class="field"><label for="f-${key}">${label}</label><input class="input" data-field="${key}" id="f-${key}" type="${kind}" value="${E(x[key]||'')}" placeholder="${hint}"></div>`;let h='';if(['work','website','deal'].includes(x.type))h+=input(x.type==='work'?'演示地址':x.type==='website'?'网站地址':'领取 / 来源地址','url','url','https://…');if(x.type==='work')h+=input('源码地址','repo','url','https://…')+input('技术栈','tech','text','Java, Python, …');if(x.type==='tutorial')h+=`<div class="field"><label for="f-chapters">章节清单</label><textarea id="f-chapters" data-field="chapters" placeholder="每行一章">${E(x.chapters)}</textarea><div class="help">原型仅保存章节清单，不提供每章独立编辑。</div></div>`;if(x.type==='deal')h+=`<div class="field"><label for="f-validity">活动有效状态</label><select id="f-validity" data-field="validity">${[['pending','待核验'],['valid','有效（手动标记）'],['expired','已过期'],['invalid','已失效']].map(([id,n])=>`<option value="${id}" ${x.validity===id?'selected':''}>${n}</option>`).join('')}</select></div>`+input('截止日期','deadline','date')+`<div class="field"><label for="f-requirements">适用条件与限制</label><textarea id="f-requirements" data-field="requirements">${E(x.requirements)}</textarea></div>`;return h}
function editorHtml(){const x=editing;return `<div class="editorbar"><div class="editorinfo"><button class="quiet" onclick="navigate('list','${x.type}')">← 返回</button><span>${TYPES[x.type].name}编辑</span>${badge(x.status)}<span id="saveState">未修改</span></div><div class="buttons"><button onclick="document.body.classList.toggle('focused')">专注</button><button onclick="previewEditor()">预览</button><button onclick="saveEditor('draft')">保存草稿</button><button class="primary" onclick="saveEditor('published')">${x.status==='published'?'更新':'发布'}</button></div></div><div class="editorgrid"><section class="panel editorpaper"><input class="titleinput" data-field="title" aria-label="标题" value="${E(x.title)}" placeholder="写下一个标题…"><textarea class="summaryinput" data-field="summary" aria-label="摘要" placeholder="添加一段摘要…">${E(x.summary)}</textarea><div class="editortabs"><button class="active" id="editTab" onclick="editorPreview(false)">Markdown</button><button id="readTab" onclick="editorPreview(true)">阅读预览</button><small>基础语法 / 本地演示</small></div><textarea class="bodyinput" id="bodyEditor" data-field="body" aria-label="正文" placeholder="从这里开始…">${E(x.body)}</textarea><div class="prose" id="inlinePreview" hidden></div><div class="footnote">保存只发生在浏览器，不会更新线上网站。</div></section><aside class="settingsstack"><section class="panel"><h2>发布设置</h2><div class="field"><label for="f-category">分类</label><input class="input" data-field="category" id="f-category" value="${E(x.category)}" placeholder="输入分类"></div><div class="field"><label for="f-tags">标签</label><input class="input" data-field="tags" id="f-tags" value="${E(x.tags)}" placeholder="以逗号分隔"></div><div class="switchrow"><span>首页精选</span><input type="checkbox" class="switch" data-field="featured" ${x.featured?'checked':''} aria-label="首页精选"></div><div class="helpbox" style="margin-top:15px">发布仅改变本地状态。没有真实定时发布、权限控制或版本历史。</div></section><section class="panel"><h2>${TYPES[x.type].name}信息</h2>${extraFields(x)||'<div class="footnote">封面可在媒体库体验上传；当前尚未与文章关联。</div>'}</section></aside></div>`}
function bindEditor(){document.querySelectorAll('[data-field]').forEach(n=>n.addEventListener('input',()=>{editing[n.dataset.field]=n.type==='checkbox'?n.checked:n.value;dirty=true;$('saveState').innerHTML='<span class="dirtydot"></span>有未保存修改';if(editPreview)$('inlinePreview').innerHTML=markdown(editing.body)}))}function markdown(text){const lines=String(text||'').split('\n');let out='',code=false,chunk=[],paragraph=[],ul=false;function flush(){if(paragraph.length){out+='<p>'+E(paragraph.join('\n'))+'</p>';paragraph=[]}if(ul){out+='</ul>';ul=false}}for(const line of lines){if(line.startsWith('```')){flush();if(code){out+='<pre><code>'+E(chunk.join('\n'))+'</code></pre>';chunk=[]}code=!code;continue}if(code){chunk.push(line);continue}if(!line.trim()){flush();continue}let m;if(m=line.match(/^(#{1,3})\s+(.*)$/)){flush();out+=`<h${m[1].length}>${E(m[2])}</h${m[1].length}>`}else if(line.startsWith('> ')){flush();out+='<blockquote>'+E(line.slice(2))+'</blockquote>'}else if(line.startsWith('- ')){if(paragraph.length){out+='<p>'+E(paragraph.join('\n'))+'</p>';paragraph=[]}if(!ul){out+='<ul>';ul=true}out+='<li>'+E(line.slice(2))+'</li>'}else{if(ul){out+='</ul>';ul=false}paragraph.push(line)}}flush();if(code)out+='<pre><code>'+E(chunk.join('\n'))+'</code></pre>';return out||'<p>还没有正文。</p>'}function editorPreview(v){editPreview=v;$('bodyEditor').hidden=v;$('inlinePreview').hidden=!v;$('editTab').classList.toggle('active',!v);$('readTab').classList.toggle('active',v);if(v)$('inlinePreview').innerHTML=markdown(editing.body)}
function saveEditor(s){if(!editing.title.trim()){toast('请先填写标题');document.querySelector('.titleinput').focus();return}for(const k of ['url','repo'])if(editing[k]){try{const u=new URL(editing[k]);if(!['http:','https:'].includes(u.protocol))throw Error()}catch(e){toast('请填写有效的 http 或 https 地址');return}}editing.status=s;editing.updated=now();const i=state.items.findIndex(x=>x.id===editing.id),copy=JSON.parse(JSON.stringify(editing));if(i<0)state.items.unshift(copy);else state.items[i]=copy;log((s==='published'?'发布 / 更新：':'保存草稿：')+editing.title);const ok=persist();dirty=false;renderNav();$('saveState').textContent=ok?'已保存到本地':'已暂存到内存';toast(ok?'已更新本地演示内容，不会上线':'请导出备份保留修改')}
function previewEditor(){modal('阅读预览 · 未发布',`<article class="prose"><h1>${E(editing.title||'未命名文章')}</h1><p style="font:10px sans-serif;color:#a4b490">${TYPES[editing.type].name} · ${E(editing.category||'未分类')} · 示例预览</p><p>${E(editing.summary)}</p>${markdown(editing.body)}</article>`)}
function mediaHtml(){return head('媒体库','整理背景和图片，让每次创作更顺手。','<button class="primary" onclick="$ (\'mediaInput\').click()">＋ 上传图片</button>')+`<div class="mediaupload"><strong>把喜欢的画面，收进素材库</strong><p>每张不超过 3MB · 支持浏览器可读取的图片 · 仅本地保存</p><button style="font-size:10px" onclick="$ ('mediaInput').click()">选择图片</button></div><div class="mediagrid">${state.media.map(m=>`<article class="mediacard"><img src="${E(m.src)}" alt="${E(m.name)}"><h3>${E(m.name)}</h3><div class="mediabottom"><small>${m.builtin?'原创内嵌插画':Math.ceil(m.size/1024)+' KB'}</small><button onclick="viewMedia('${m.id}')">查看</button>${m.builtin?'':`<button onclick="deleteMedia('${m.id}')">删除</button>`}</div></article>`).join('')}</div><p class="footnote">浏览器空间有限，上传后建议导出备份。不提供云存储、裁剪和自动压缩。</p>`}function viewMedia(id){const m=state.media.find(x=>x.id===id);modal(m.name,`<img src="${E(m.src)}" alt="${E(m.name)}" style="display:block;margin:auto;max-width:100%;max-height:55vh;border-radius:12px">`)}function deleteMedia(id){confirmLocal('删除素材？','将从当前浏览器的素材库中删除此图片。',()=>{state.media=state.media.filter(m=>m.id!==id);log('删除媒体素材');persist();render()})}function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function checkImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=res;i.onerror=rej;i.src=src})}
$('mediaInput').addEventListener('change',async e=>{for(const f of [...e.target.files]){if(!f.type.startsWith('image/')||f.size>3*1024*1024){toast('请使用 3MB 以内的图片');continue}try{const src=await readFile(f);await checkImage(src);state.media.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),name:f.name,src,size:f.size});log('上传图片：'+f.name)}catch(e){toast('图片读取失败')}}const ok=persist();if(view==='media')render();if(ok)toast('图片已添加到本地素材库');e.target.value=''});
function appearanceHtml(){appearanceDraft={...state.appearance};appearanceDirty=false;return head('外观设置','人文阅读与磨砂质感，在同一套设计里安静共存。','<button onclick="resetAppearance()">恢复默认</button><button class="primary" onclick="saveAppearance()">应用更改</button>')+`<div class="appearancegrid"><section class="panel appcontrols"><div><h2>首屏与背景</h2><div class="field"><label for="appHeadline">首屏文案</label><input class="input" id="appHeadline" value="${E(appearanceDraft.headline)}" oninput="changeAppearance('headline',this.value)"></div><div class="field"><label for="appSubtitle">一句话介绍</label><input class="input" id="appSubtitle" value="${E(appearanceDraft.subtitle)}" oninput="changeAppearance('subtitle',this.value)"></div><span class="footnote">背景图片</span><div class="thumb"></div><div class="buttons"><button style="font-size:10px" onclick="$ ('bgInput').click()">上传背景</button><button style="font-size:10px" onclick="defaultScene()">使用雾山</button></div><p class="footnote">原创 SVG，完全离线可用。</p></div><div class="sectionline"><h2>玻璃与阅读</h2>${[['glass','卡片不透明度',60,98,1,'%'],['paper','正文不透明度',80,99,1,'%'],['blur','磨砂程度',0,28,1,'px'],['size','正文字号',16,23,1,'px'],['line','正文行高',1.6,2.2,.05,'']].map(([k,n,min,max,step,u])=>`<label class="rangeline" for="range-${k}"><span>${n}</span><output id="out-${k}">${appearanceDraft[k]}${u}</output></label><input type="range" id="range-${k}" min="${min}" max="${max}" step="${step}" value="${appearanceDraft[k]}" oninput="changeAppearance('${k}',Number(this.value),'${u}')">`).join('')}<div class="helpbox">调整先更新预览，应用后保存到浏览器。不会修改真实前台；统计图表保持稳定浅底。</div></div></section><section class="previewshell"><div class="previewtop"><div class="segmented"><button id="previewHome" class="${previewMode==='home'?'active':''}" onclick="setPreviewMode('home')">首页</button><button id="previewArticle" class="${previewMode==='article'?'active':''}" onclick="setPreviewMode('article')">文章页</button></div><div class="segmented"><button id="previewDesktop" class="${!previewMobile?'active':''}" onclick="setPreviewMobile(false)">桌面</button><button id="previewMobile" class="${previewMobile?'active':''}" onclick="setPreviewMobile(true)">手机</button></div></div><div class="previewframe ${previewMobile?'mobile':''}" id="previewViewport"><iframe id="frontPreview" title="前台样式预览" sandbox></iframe></div></section></div>`}
function changeAppearance(k,v,u=''){appearanceDraft[k]=v;appearanceDirty=true;if($('out-'+k))$('out-'+k).textContent=v+u;applyAppearance(appearanceDraft);updatePreview()}function defaultScene(){changeAppearance('image',DEFAULT_BG);toast('已切换预览背景，应用后保存')}function saveAppearance(){state.appearance={...appearanceDraft};log('应用外观设置');const ok=persist();appearanceDirty=false;toast(ok?'已保存本地外观设置':'外观暂存当前页面，请导出备份')}function resetAppearance(){confirmLocal('恢复默认外观？','恢复默认样式，不删除文章或其他内容。',()=>{state.appearance={...seed().appearance};appearanceDirty=false;applyAppearance(state.appearance);persist();render();toast('已恢复默认外观')})}
$('bgInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>3*1024*1024){toast('请选择 3MB 以内的图片');e.target.value='';return}try{const src=await readFile(f);await checkImage(src);changeAppearance('image',src);toast('背景已载入预览，应用后保存')}catch(e){toast('无法读取图片')}e.target.value=''});
function frontHtml(a,mode='home'){return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#d9e3cd url('${a.image}') center/cover fixed;color:#4b6140;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}.glass{background:rgba(251,248,236,${a.glass/100});border:1px solid #fff9;backdrop-filter:blur(${a.blur}px);border-radius:13px}nav{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}nav b{font:18px 'Songti SC',SimSun,serif}nav span{font-size:9px;word-spacing:8px}header{padding:43px 8px 27px}small{font:8px monospace;letter-spacing:.12em;color:#8a9a77}h1{font:500 36px/1.65 'Songti SC',SimSun,serif;margin:15px 0}p{font-size:11px;line-height:2;color:#82956d}.cards{display:grid;grid-template-columns:1fr 2fr;gap:15px}.card{padding:23px}.card h2{font:23px/1.65 'Songti SC',SimSun,serif}.card p{font:14px/1.95 'Songti SC',SimSun,serif}.reading{max-width:700px;margin:25px auto;padding:30px;background:rgba(252,249,240,${a.paper/100});border:1px solid #fff9;border-radius:15px;backdrop-filter:blur(${a.blur}px);font:${a.size}px/${a.line} 'Songti SC',SimSun,serif}.reading h1{font-size:30px}.reading p{font:inherit;color:#71855c}.reading h2{font-size:1.2em;margin-top:1.8em}.reading blockquote{border-left:2px solid #aebb95;margin:25px 0;padding-left:16px;color:#91a479}.note{text-align:center;font-size:9px;color:#90a378;margin-top:24px}@media(max-width:450px){body{padding:14px}nav span{display:none}h1{font-size:31px}.cards{grid-template-columns:1fr}.profile{display:none}.reading{padding:23px;font-size:18px}.reading h1{font-size:27px}}</style></head><body><nav class="glass"><b>${E(state.settings.name)}</b><span>首页 文章 作品 教程 网站 羊毛</span></nav>${mode==='home'?`<header><small>NOTES, CODE & EVERYDAY LIFE</small><h1>${E(a.headline).replace('，','，<br>')}</h1><p>${E(a.subtitle)}</p></header><div class="cards"><div class="card glass profile"><small>HELLO, I'M</small><h2>菜牙</h2><p>在代码与生活之间，<br>给想法留一个位置。</p></div><div class="card glass"><small>DESIGN NOTES</small><h2>给想法一个安静的地方</h2><p>从文字、背景和适当的留白开始，让博客成为一个愿意长久停留的地方。</p></div></div>`:`<article class="reading"><small>DESIGN NOTES / 设计手记</small><h1>给想法一个<br>安静的地方</h1><p>最初想做个人博客，是因为很多想法散落在不同的地方。我想把它们收集起来，放在一个不那么匆忙的地方。</p><h2>让文字拥有自己的节奏</h2><p>风景安静地留在卡片边缘。进入长文之后，纸面的底色会变厚，让每段阅读都有一个安稳的位置。</p><blockquote>风景在文字背后，阅读始终在画面中央。</blockquote><p>页面可以慢慢长大，气质不必每次重新开始。</p></article>`}<div class="note">${E(state.settings.footer)} · 静态外观预览</div></body></html>`}
function updatePreview(){if($('frontPreview'))$('frontPreview').srcdoc=frontHtml(appearanceDraft,previewMode)}function setPreviewMode(m){previewMode=m;$('previewHome').classList.toggle('active',m==='home');$('previewArticle').classList.toggle('active',m==='article');updatePreview()}function setPreviewMobile(v){previewMobile=v;$('previewViewport').classList.toggle('mobile',v);$('previewDesktop').classList.toggle('active',!v);$('previewMobile').classList.toggle('active',v)}function showFront(){modal('前台外观预览',`<iframe id="visitFrame" title="前台外观预览" sandbox style="width:100%;height:60vh;border:0;border-radius:12px"></iframe><p class="footnote">这是内嵌静态预览，不是线上站点。</p>`);$('visitFrame').srcdoc=frontHtml(state.appearance)}
function settingsHtml(){return head('系统设置','站点基本信息与本地演示数据管理。','<button class="primary" onclick="saveSettings()">保存设置</button>')+`<div class="settingsgrid"><section class="panel"><h2>网站信息</h2><div class="field"><label for="siteName">站点名称</label><input class="input" id="siteName" value="${E(state.settings.name)}"></div><div class="field"><label for="siteDescription">站点描述</label><textarea id="siteDescription">${E(state.settings.description)}</textarea></div><div class="field"><label for="siteFooter">页脚文案</label><input class="input" id="siteFooter" value="${E(state.settings.footer)}"></div><div class="helpbox">不提供真实账号认证或权限保护。发布仅更新本地状态；统计样本与内容数据独立。</div><div class="sectionline"><h2>数据管理</h2><div class="buttons"><button onclick="exportBackup()">导出 JSON 备份</button><button class="danger" onclick="resetData()">重置演示数据</button></div><p class="footnote">提供导出，不包含导入恢复。统计报表请在“数据统计”页面单独导出 CSV。</p></div></section><aside class="panel"><h2>运行信息</h2><p class="footnote" style="font-size:11px;line-height:2.7">模式：单文件离线原型<br>内容存储：localStorage<br>统计来源：固定合成会话<br>后端连接：无<br>外部依赖：无<br>版本：完整整合版 2.0</p><div class="helpbox" style="margin-top:20px">清理浏览器数据可能导致本地修改丢失。建议定期导出 JSON；合成统计数据始终内嵌，不会采集真实访问。</div><button style="font-size:10px;margin-top:18px" onclick="navigate('analytics')">打开数据统计 ↗</button></aside></div>`}
function saveSettings(){const name=$('siteName').value.trim();if(!name){toast('站点名称不能为空');$('siteName').focus();return}state.settings={name,description:$('siteDescription').value,footer:$('siteFooter').value};log('更新网站基本信息');const ok=persist();renderNav();toast(ok?'已保存本地站点设置':'设置暂存当前页面，请导出备份')}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}function exportBackup(){state.backupAt=now();log('导出本地 JSON 数据');persist();download(JSON.stringify({prototype:'caiya-complete-admin-ui',exportedAt:now(),data:state,analytics:{source:'synthetic',range:['2026-08-23','2026-10-21'],note:'统计样本内嵌在HTML中；报表在统计页单独导出。'}},null,2),'caiya-content-backup.json','application/json');toast('已发起 JSON 下载，请确认浏览器下载结果');if(view==='dashboard')render()}function resetData(){confirmLocal('重置全部演示数据？','清除本地编辑、上传图片和外观设置，恢复默认内容。建议先导出备份。合成统计样本不受影响。',()=>{state=seed();dirty=false;appearanceDirty=false;editing=null;persist();applyAppearance(state.appearance);navigate('dashboard',null,true);toast('已恢复默认演示内容')})}
function openSearch(){modal('搜索内容','<input class="input" id="globalQuery" style="width:100%" placeholder="搜索标题、摘要或标签…" oninput="runSearch(this.value)"><div id="globalResults"></div>');runSearch('');$('globalQuery').focus()}function runSearch(q){const found=live().filter(x=>[x.title,x.summary,x.tags].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,10);$('globalResults').innerHTML=found.length?found.map(x=>`<button class="searchresult" onclick="closeModal();startEdit('${x.id}')">${E(x.title)}<small>${TYPES[x.type].name} · ${x.status==='published'?'已发布':'草稿'} · ${date(x.updated)}</small></button>`).join(''):'<div class="empty">没有相关内容</div>'}
window.addEventListener('message',e=>{if(e.source!==$('analyticsFrame').contentWindow||e.data?.kind!=='caiya-stats-height')return;const h=Number(e.data.height);if(Number.isFinite(h)&&h>=300&&h<20000)$('analyticsFrame').style.height=(Math.ceil(h)+12)+'px'});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&view==='editor'){e.preventDefault();saveEditor(editing.status)}if(e.key==='Escape')closeMenu()});window.addEventListener('beforeunload',e=>{if(dirty||appearanceDirty){e.preventDefault();e.returnValue=''}});$('modal').addEventListener('click',e=>{if(e.target!==$('modal'))return;const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()});applyAppearance(state.appearance);render();</script></body></html>
